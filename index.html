<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر طلال</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        
        header { background: #1a252f; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #2ecc71; }
        .cart-icon { cursor: pointer; position: relative; font-size: 1.2rem; background: #2c3e50; padding: 0.5rem 1rem; border-radius: 20px; }
        .cart-count { background: #e74c3c; color: white; border-radius: 50%; padding: 2px 7px; font-size: 0.8rem; margin-right: 5px; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .hero { text-align: center; margin-bottom: 2.5rem; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; padding: 1rem; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
        .product-title { font-size: 1.1rem; margin: 0.8rem 0 0.4rem; }
        .product-price { color: #2ecc71; font-weight: bold; font-size: 1.2rem; margin-bottom: 0.8rem; }
        .btn-add { background: #2ecc71; color: white; border: none; padding: 0.6rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; font-weight: bold; }

        /* Modal السلة */
        .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .cart-content { background: white; width: 90%; max-width: 500px; border-radius: 12px; padding: 1.5rem; max-height: 80vh; overflow-y: auto; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 0.8rem; margin-bottom: 1rem; }
        .close-btn { font-size: 1.5rem; cursor: pointer; color: #777; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        .cart-total { font-size: 1.2rem; font-weight: bold; text-align: left; margin-top: 1rem; }
        .btn-whatsapp { background: #25D366; color: white; border: none; padding: 0.8rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; font-weight: bold; margin-top: 1rem; display: block; text-align: center; text-decoration: none; }

        footer { text-align: center; padding: 1.5rem; background: #1a252f; color: white; margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">متجر طلال</div>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 السلة <span class="cart-count" id="cart-count">0</span>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>أهلاً بك في متجرنا</h1>
            <p>اختر منتجاتك وسنكمل طلبك عبر الواتساب فوراً</p>
        </section>

        <main class="products-grid">
            <div class="product-card">
                <img src="https://via.placeholder.com/250" alt="منتج 1">
                <h3 class="product-title">منتج مميز 1</h3>
                <p class="product-price">150 ر.س</p>
                <button class="btn-add" onclick="addToCart('منتج مميز 1', 150)">إضافة للسلة</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/250" alt="منتج 2">
                <h3 class="product-title">منتج مميز 2</h3>
                <p class="product-price">200 ر.س</p>
                <button class="btn-add" onclick="addToCart('منتج مميز 2', 200)">إضافة للسلة</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/250" alt="منتج 3">
                <h3 class="product-title">منتج مميز 3</h3>
                <p class="product-price">99 ر.س</p>
                <button class="btn-add" onclick="addToCart('منتج مميز 3', 99)">إضافة للسلة</button>
            </div>
        </main>
    </div>

    <!-- نافذة السلة -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h3>سلة الشراء</h3>
                <span class="close-btn" onclick="toggleCart()">&times;</span>
            </div>
            <div id="cart-items">
                <p style="text-align:center; color:#888;">السلة فارغة حالياً</p>
            </div>
            <div class="cart-total" id="cart-total">المجموع: 0 ر.س</div>
            <button class="btn-whatsapp" onclick="checkoutWhatsApp()">إتمام الطلب عبر الواتساب 💬</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لـ متجر طلال</p>
    </footer>

    <script>
        const myPhoneNumber = "966506438385"; 

        let cart = [];

        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if(item) {
                item.qty++;
            } else {
                cart.push({name, price, qty: 1});
            }
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            cartCount.innerText = totalQty;
            cartTotal.innerText = `المجموع: ${totalPrice} ر.س`;

            if(cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align:center; color:#888;">السلة فارغة حالياً</p>';
                return;
            }

            cartItemsContainer.innerHTML = '';
            cart.forEach(item => {
                cartItemsContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>${item.price} ر.س × ${item.qty}</small>
                        </div>
                        <div>
                            <strong>${item.price * item.qty} ر.س</strong>
                        </div>
                    </div>
                `;
            });
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            let text = "السلام عليكم، أرغب بطلب المنتجات التالية من متجر طلال:\n\n";
            let totalPrice = 0;
            cart.forEach(item => {
                text += `- ${item.name} (العدد: ${item.qty}) بسعر: ${item.price * item.qty} ر.س\n`;
                totalPrice += item.price * item.qty;
            });
            text += `\nالمجموع الكلي: ${totalPrice} ر.س`;

            let url = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
